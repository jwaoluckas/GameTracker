<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameTracker · Entrar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff4fa3'/%3E%3Cstop offset='1' stop-color='%238b2ff0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='10' fill='url(%23g)'/%3E%3Ctext x='20' y='26' font-family='Arial' font-weight='bold' font-size='15' fill='white' text-anchor='middle'%3EGT%3C/text%3E%3C/svg%3E">
<!-- Projeto 100% offline: sem CDNs externos. Tipografia usa a stack de fontes do sistema (ver shared/base.css). -->
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="index.css">
</head>
<body class="page-login">

<div id="toast-container" class="toast-container" aria-live="polite"></div>

<div class="blob blob-pink blob-login-1" aria-hidden="true"></div>
<div class="blob blob-purple blob-login-2" aria-hidden="true"></div>

<header class="brand-header">
  <div class="brand">
    <div class="brand-mark">GT</div>
    <span class="brand-name">GameTracker</span>
  </div>
</header>

<main class="center-stage">
  <div class="card login-card">
    <h1 class="card-title">Bem-vindo de volta</h1>
    <p class="card-subtitle">Entre para continuar seu backlog de jogos</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" name="email" placeholder="voce@email.com" autocomplete="username" value="jogador@gametracker.com">
      </div>
      <div class="field">
        <label for="login-password">Senha</label>
        <div class="password-wrap">
          <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password" value="gametracker123">
          <button type="button" id="toggle-password" class="password-toggle" aria-label="Mostrar senha" aria-pressed="false">
            <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg id="icon-eye-off" hidden xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06"></path>
              <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19"></path>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>
      <p id="login-error" class="field-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      <p class="helper-line">
        Não tem conta? <a href="#" id="signup-link" class="link-strong">Cadastre-se</a>
      </p>
    </form>
  </div>
</main>

<script src="shared/data.js"></script>
<script src="shared/ui.js"></script>
<script src="script.js"></script>
</body>
</html>
