<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameTracker · Minha Biblioteca</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff4fa3'/%3E%3Cstop offset='1' stop-color='%238b2ff0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='10' fill='url(%23g)'/%3E%3Ctext x='20' y='26' font-family='Arial' font-weight='bold' font-size='15' fill='white' text-anchor='middle'%3EGT%3C/text%3E%3C/svg%3E">
<!-- Projeto 100% offline: sem CDNs externos. Tipografia usa a stack de fontes do sistema (ver shared/base.css). -->
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="biblioteca.css">
</head>
<body class="page-app">

<div id="toast-container" class="toast-container" aria-live="polite"></div>

<div id="confirm-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
  <div class="modal-card">
    <p id="confirm-modal-title" class="modal-title"></p>
    <div class="modal-actions">
      <button type="button" id="confirm-modal-cancel" class="btn btn-secondary btn-block">Cancelar</button>
      <button type="button" id="confirm-modal-ok" class="btn btn-danger-solid btn-block">Remover</button>
    </div>
  </div>
</div>

<div class="page-shell">
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">GT</div>
      <span class="brand-name">GameTracker</span>
    </div>
    <div class="header-actions">
      <button type="button" id="logout-btn" class="btn btn-ghost btn-sm">Sair</button>
      <button type="button" id="new-game-btn" class="btn btn-primary btn-sm">+ Novo Jogo</button>
    </div>
  </header>

  <main class="app-body">
    <div class="page-title">
      <h1>Minha Biblioteca</h1>
      <p id="games-count">0 jogos cadastrados</p>
    </div>

    <div class="filter-tabs" role="tablist" aria-label="Filtrar por status">
      <button type="button" class="tab active" data-filter="todos" role="tab" aria-selected="true">Todos</button>
      <button type="button" class="tab" data-filter="fila" role="tab" aria-selected="false">
        <span class="label-full">Na fila</span><span class="label-short">Fila</span>
      </button>
      <button type="button" class="tab" data-filter="jogando" role="tab" aria-selected="false">Jogando</button>
      <button type="button" class="tab" data-filter="platinado" role="tab" aria-selected="false">
        <span class="label-full">Platinado</span><span class="label-short">Platina</span>
      </button>
    </div>

    <div id="games-grid" class="games-grid"></div>

    <div id="empty-state" class="empty-state" hidden>
      <p class="empty-title">Nenhum jogo por aqui</p>
      <p class="empty-subtitle">Adicione um jogo para começar a montar sua biblioteca.</p>
    </div>
  </main>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/ui.js"></script>
<script src="biblioteca.js"></script>
</body>
</html>
